name: benchmark-source-fetch
on:
  push:
    branches: ["benchmark-fetch-tmp"]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch balanced FAMMA multilingual originals
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p public_selected/assets/multilingual_financial_reasoning
          python -m pip install -q --disable-pip-version-check 'datasets>=3.0' pillow requests
          python - <<'PY'
          import json, io, os, requests, collections
          from pathlib import Path
          from datasets import load_dataset
          from PIL import Image
          outdir=Path('public_selected/assets/multilingual_financial_reasoning')
          ds=load_dataset('weaverbirdllm/famma')
          counts=collections.Counter()
          for split in ['release_basic','release_livepro']:
              if split in ds:
                  for row in ds[split]: counts[str(row.get('language','')).strip().lower()]+=1
          print('language_counts',dict(counts))
          targets={k:5 for k in ['chinese','french'] if counts[k]>0}
          if len(targets)<2:
              langs=[k for k,v in counts.items() if k not in ('english','en','') and v>0][:2]
              targets={k:5 for k in langs}
          assert len(targets)==2,targets
          selected={k:[] for k in targets}
          def save_any(obj,dst):
              if obj is None or obj=='': return False
              try:
                  if hasattr(obj,'save'):
                      obj.convert('RGB').save(dst,quality=95); return True
                  if isinstance(obj,dict) and obj.get('bytes'):
                      Image.open(io.BytesIO(obj['bytes'])).convert('RGB').save(dst,quality=95); return True
                  if isinstance(obj,dict) and obj.get('path'):
                      Image.open(obj['path']).convert('RGB').save(dst,quality=95); return True
                  if isinstance(obj,str) and obj.startswith(('http://','https://')):
                      b=requests.get(obj,timeout=30).content; Image.open(io.BytesIO(b)).convert('RGB').save(dst,quality=95); return True
                  if isinstance(obj,str) and os.path.exists(obj):
                      Image.open(obj).convert('RGB').save(dst,quality=95); return True
              except Exception as e: print('image-save-failed',type(obj),str(e)[:200])
              return False
          records=[]
          for split in ['release_basic','release_livepro']:
              if split not in ds: continue
              for idx,row in enumerate(ds[split]):
                  lang=str(row.get('language','')).strip().lower()
                  if lang not in targets or len(selected[lang])>=targets[lang]: continue
                  if not str(row.get('question','')).strip() or row.get('answers') is None: continue
                  image_objs=[row.get(f'image_{i}') for i in range(1,8)]
                  if not any(x is not None and x!='' for x in image_objs): continue
                  n=len(records)+1; paths=[]
                  for j,obj in enumerate(image_objs,1):
                      if obj is None or obj=='': continue
                      dst=outdir/f'{n:02d}_{j:02d}.jpg'
                      if save_any(obj,dst): paths.append(str(dst).replace('public_selected/',''))
                  if not paths: continue
                  rec={'task':'multilingual_financial_reasoning','source_benchmark':'FAMMA','source_split':split,'source_index':idx,'question_id':row.get('question_id'),'context':row.get('context'),'question':row.get('question'),'options':row.get('options') or [],'answer':row.get('answers'),'explanation':row.get('explanation'),'language':row.get('language'),'subfield':row.get('subfield'),'question_type':row.get('question_type'),'image_type':row.get('image_type'),'local_image_paths':paths}
                  records.append(rec); selected[lang].append(rec)
                  if all(len(selected[k])>=targets[k] for k in targets): break
              if all(len(selected[k])>=targets[k] for k in targets): break
          assert len(records)==10,(len(records),{k:len(v) for k,v in selected.items()})
          with open('public_selected/famma_selected.jsonl','w',encoding='utf-8') as f:
              for x in records:f.write(json.dumps(x,ensure_ascii=False,default=str)+'\n')
          print('selected_languages',[r['language'] for r in records])
          PY
      - name: Upload FAMMA originals
        uses: actions/upload-artifact@v4
        with:
          name: famma-balanced-selected
          path: public_selected/
          retention-days: 1
          compression-level: 6
