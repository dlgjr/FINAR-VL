name: benchmark-source-fetch
on:
  push:
    branches: ["benchmark-fetch-tmp"]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and extract public benchmark samples
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p public_selected
          curl -L --retry 3 --fail -o MMfin_CN.tsv 'https://huggingface.co/datasets/hithink-ai/MME-Finance/resolve/main/MMfin_CN.tsv?download=true'
          curl -L --retry 3 --fail -o MMfin_CN.zip 'https://huggingface.co/datasets/hithink-ai/MME-Finance/resolve/main/MMfin_CN.zip?download=true'
          python - <<'PY'
          import csv, json, zipfile, shutil
          from pathlib import Path
          cats = {
              'Image Caption':'financial_visual_description',
              'Spatial Awareness':'visual_grounding_spatial_awareness',
              'Numerical Calculation':'visual_numerical_estimation',
          }
          with open('MMfin_CN.tsv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f,delimiter='\t'))
          z=zipfile.ZipFile('MMfin_CN.zip'); members=z.namelist(); out=[]
          for cat,task in cats.items():
              cand=[r for r in rows if r['task_category']==cat]
              selected=[]; seen_paths=set(); seen_pairs=set()
              for r in cand:
                  if r['image_path'] in seen_paths: continue
                  pair=(r.get('image_type',''),r.get('image_style',''))
                  if pair in seen_pairs and len(selected)<6: continue
                  selected.append(r); seen_paths.add(r['image_path']); seen_pairs.add(pair)
                  if len(selected)==10: break
              if len(selected)<10:
                  for r in cand:
                      if r['image_path'] in seen_paths: continue
                      selected.append(r); seen_paths.add(r['image_path'])
                      if len(selected)==10: break
              assert len(selected)==10,(cat,len(selected))
              tdir=Path('public_selected/assets')/task; tdir.mkdir(parents=True,exist_ok=True)
              for i,r in enumerate(selected,1):
                  rel=r['image_path'].replace('\\','/')
                  matches=[m for m in members if m.endswith('/'+rel) or m==rel]
                  assert matches,('missing',rel)
                  suffix=Path(rel).suffix.lower() or '.png'; dst=tdir/f'{i:02d}{suffix}'
                  with z.open(matches[0]) as src, open(dst,'wb') as fo: shutil.copyfileobj(src,fo)
                  out.append({'task':task,'source_benchmark':'MME-Finance','source_index':int(r['index']),'source_task_category':cat,'question':r['question'],'answer':r['answer'],'image_type':r.get('image_type',''),'image_style':r.get('image_style',''),'original_image_path':rel,'local_image_path':str(dst).replace('public_selected/','')})
          with open('public_selected/mme_selected.jsonl','w',encoding='utf-8') as f:
              for x in out:f.write(json.dumps(x,ensure_ascii=False)+'\n')
          print('MME selected',len(out))
          PY

          python -m pip install -q --disable-pip-version-check 'datasets>=3.0' pillow
          python - <<'PY'
          import json, io
          from pathlib import Path
          from datasets import load_dataset
          from PIL import Image
          outdir=Path('public_selected/assets/multilingual_crosslingual_financial_reasoning'); outdir.mkdir(parents=True,exist_ok=True)
          ds=load_dataset('weaverbirdllm/famma')
          print(ds)
          chosen=[]
          for split in ds.keys():
              for idx,row in enumerate(ds[split]):
                  lang=str(row.get('language','')).lower()
                  if lang in ('english','en',''):
                      continue
                  img=row.get('image')
                  if img is None or not str(row.get('question','')).strip() or row.get('answer') is None:
                      continue
                  chosen.append((split,idx,row))
                  if len(chosen)>=10: break
              if len(chosen)>=10: break
          assert len(chosen)==10,len(chosen)
          records=[]
          for n,(split,idx,row) in enumerate(chosen,1):
              img=row['image']
              if isinstance(img,dict) and img.get('bytes'):
                  im=Image.open(io.BytesIO(img['bytes'])).convert('RGB')
              elif hasattr(img,'save'):
                  im=img.convert('RGB')
              elif isinstance(img,dict) and img.get('path'):
                  im=Image.open(img['path']).convert('RGB')
              else: raise RuntimeError(type(img))
              dst=outdir/f'{n:02d}.jpg'; im.save(dst,quality=95)
              records.append({'task':'multilingual_crosslingual_financial_reasoning','source_benchmark':'FAMMA','source_split':split,'source_index':idx,'question':row.get('question'),'options':row.get('options') or row.get('choices') or [],'answer':row.get('answer'),'language':row.get('language'),'subfield':row.get('subfield'),'image_type':row.get('image_type'),'local_image_path':str(dst).replace('public_selected/','')})
          with open('public_selected/famma_selected.jsonl','w',encoding='utf-8') as f:
              for x in records:f.write(json.dumps(x,ensure_ascii=False,default=str)+'\n')
          print('FAMMA selected',len(records))
          PY
      - name: Upload selected originals
        uses: actions/upload-artifact@v4
        with:
          name: public-benchmark-selected
          path: public_selected/
          retention-days: 1
          compression-level: 6
